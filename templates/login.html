<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Gunn Group Dashboards</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    form{background:#fff;border:1px solid #ddd;border-radius:8px;padding:2rem;width:320px}
    h1{font-size:16px;margin-bottom:1rem}
    label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:12px}
    input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;box-sizing:border-box}
    button{width:100%;margin-top:1.25rem;background:#1a6eb5;color:#fff;padding:10px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
    .flash{color:#c0392b;font-size:12px;margin-top:10px}
  </style>
</head>
<body>
  <form method="post">
    <h1>Gunn Group Dashboards</h1>
    <label>Username</label>
    <input type="text" name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log in</button>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
  </form>
</body>
</html>
